dirs:
  raw: results/raw
  summary: results/summary
  merged: results/merged
  annotation: results/annotation
  gdc_cache: results/cache    # GDCdownload writes here instead of the working directory

# TCGA sample type filter.
# "all" downloads every available sample type for each project.
# To restrict to a specific type use a code: "TP" (Primary Tumor),
# "NT" (Solid Tissue Normal), "TB" (Blood Derived Normal), etc.
sample_type: "all"

modalities:
  run_mrna: true
  run_mirna: true
  run_methylation: true
  run_cnv: true
  run_annotation: true

# Path to the full project list (relative to the working directory)
projects_file: config/projects.tsv

# Subset of projects to actually run.
# Set to null (or remove this key) to run all projects in projects_file.
# Example to run only two projects:
projects:
  - TCGA-BRCA
  - TCGA-LUAD
# projects: null

# List of TCGA project:
#   High-Volume Types: BRCA (~1,098), LUAD (~585), UCEC (~548), KIRC (~533), 
#       HNSC (~528), LGG (~516), THCA (~507), LUSC (~504), PRAD (~498), COAD (~459).
#   Mid-Volume Types: STAD (~415), BLCA (~412), LIHC (~377), OV (~307), CESC (~306), KIRP (~290), 
#       SARC (~261), LAML (~200), ESCA (~184), PCPG (~179), PAAD (~177), GBM (~169), READ (~166).
#   Lower-Volume Types: TGCT (~150), THYM (~120), MESO (~87), UVM (~80), ACC (~79), KICH (~66), 
#       UCS (~57), DLBC (~48), CHOL (~36).

# Methylation: maximum number of CpG sites to retain per project.
# Sites are ranked by variance (highest first) to keep the most informative probes.
# Set to null to keep all sites (very large output).
max_cpgs: 5000
